name: edunest-backend

services:
  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: mysql://edunest:${DB_PASSWORD:-edunest_pass}@mysql:3306/edunest
      REDIS_URL: redis://redis:6379
    ports:
      - '${PORT:-4000}:4000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/jobs/worker.js']
    env_file: .env
    environment:
      DATABASE_URL: mysql://edunest:${DB_PASSWORD:-edunest_pass}@mysql:3306/edunest
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: edunest
      MYSQL_USER: edunest
      MYSQL_PASSWORD: ${DB_PASSWORD:-edunest_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./edunest_database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
